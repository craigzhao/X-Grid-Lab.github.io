# AIRE-Q Lab · Academic Pages / Jekyll
title: AIRE-Q Lab
name: AI & Quantum for Resilient Energy
description: Physics-aware AI, quantum computing, and resilient power systems at The University of Texas at Arlington.
url: https://craigzhao.github.io
baseurl: /X-Grid-Lab.github.io
repository: craigzhao/X-Grid-Lab.github.io
locale: en-US
timezone: America/Chicago
email: tianqiao.zhao@uta.edu
author:
  name: Tianqiao Zhao
  email: tianqiao.zhao@uta.edu
  employer: The University of Texas at Arlington
  location: Arlington, Texas
  github: craigzhao
include: [_pages]
exclude:
  - README.md
  - UPDATE_GUIDE.md
  - MIGRATION_NOTES.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts
  - migration
  - tests
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - dist
  - output
  - previews
  - .openai
  - Dockerfile
  - docker-compose.yaml
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - assets/css/main.scss
  - assets/js
  - assets/css/academicons.css
  - _posts
  - _drafts
markdown: kramdown
kramdown:
  input: GFM
permalink: /news/:title/
future: false
collections:
  publications:
    output: true
    permalink: /publications/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  news:
    output: true
    permalink: /news/:path/
defaults:
  - scope: {path: '', type: pages}
    values: {layout: lab-page}
  - scope: {path: '', type: publications}
    values: {layout: lab-publication}
  - scope: {path: '', type: teaching}
    values: {layout: lab-course}
  - scope: {path: '', type: news}
    values: {layout: lab-news}
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag
sass:
  style: compressed
