<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102d43"><title>{{ page.title | escape }} · {{ site.title | escape }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="canonical" href="{{ page.url | absolute_url }}"><meta property="og:title" content="{{ page.title | escape }} · {{ site.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:type" content="website"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ '/images/lab/social.svg' | absolute_url }}"><link rel="icon" href="{{ '/images/lab/favicon.svg' | relative_url }}" type="image/svg+xml"><link rel="stylesheet" href="{{ '/assets/css/lab.css' | relative_url }}"><script src="{{ '/assets/lab.js' | relative_url }}" defer></script></head><body>{% include lab/header.html %}<main id="main" tabindex="-1">{{ content }}</main>{% include lab/footer.html %}</body></html>
