<article class="publication" data-publication data-year="{{ pub.year }}" data-type="{{ pub.category | escape }}" data-search="{{ pub.title | escape }} {{ pub.authors | escape }} {{ pub.venue | escape }} {{ pub.tags | join: ' ' | escape }}">
<div class="publication-year">{{ pub.year }}<span>{{ pub.category }}</span></div><div class="publication-main"><h3><a href="{{ pub.url | relative_url }}">{{ pub.title }}</a></h3><p class="authors">{{ pub.authors }}</p><p class="venue">{{ pub.venue }}{% if pub.volume %}, {{ pub.volume }}{% endif %}{% if pub.pages %}, {{ pub.pages }}{% endif %}</p><div class="publication-links"><a href="https://doi.org/{{ pub.doi }}">DOI <span aria-hidden="true">↗</span></a>{% if pub.paperurl %}<a href="{{ pub.paperurl | relative_url }}">PDF</a>{% endif %}{% if pub.codeurl %}<a href="{{ pub.codeurl }}">Code ↗</a>{% endif %}<details><summary>Cite</summary><pre class="citation-text">{{ pub.citation | escape }}</pre><button class="copy-button" data-copy-previous>Copy citation</button></details></div></div></article>
