director:
  name: Tianqiao Zhao
  title: Assistant Professor
  role: Principal Investigator
  initials: TZ
  email: tianqiao.zhao@uta.edu
  bio: Tianqiao Zhao leads the AIRE-Q Lab in the Department of Electrical Engineering
    at The University of Texas at Arlington. His research connects power-system operation
    and control with artificial intelligence, optimization, and quantum computing.
    Current interests include stability and learning-based control, trustworthy and
    agentic AI, renewable forecasting, and the coordination of storage and flexible
    loads for reliable, resilient energy systems.
