- title: Grid foundation models
  label: Genesis Mission Phase II
  description: In a Brookhaven-led collaboration, UTA develops agentic workflows that connect grid foundation models to planning applications and validation. The work links model capabilities to practical utility decisions as new loads and resources reshape the grid.
  url: /news/2026-09-28-genesis-gridfm/
  link_text: Project overview
- title: Advanced transformers & digital twins
  label: DOE Office of Electricity collaboration
  description: We contribute to a Brookhaven-led project on scalable co-modeling and monitoring of advanced transformers and power-electronics assets. The effort studies their coupled dynamics and develops a foundation for digital twins and model validation.
  source_url: https://www.energy.gov/documents/scalable-and-flexible-meng-yue
