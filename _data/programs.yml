- id: gridfm-2-0
  group: current
  title: Grid foundation models
  full_title: GridFM 2.0
  label: Genesis Mission Phase II
  role: "UTA contribution: agentic workflows, applications, and grid validation"
  timeframe_label: Announced
  timeframe: September 28, 2026
  description: In a Brookhaven-led collaboration, UTA develops agentic workflows that connect grid foundation models to practical planning applications. The work brings model ensembles, engineering tools, and grid validation into an application layer that supports utility decisions as new loads and resources reshape the grid.
